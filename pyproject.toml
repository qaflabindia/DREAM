[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamlab-research"
version = "0.2.0"
description = "Evidence-governed, offline agent memory consolidation research prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dreamlab = "dreamlab.cli:main"

[tool.setuptools.packages.find]
include = ["dreamlab*"]
